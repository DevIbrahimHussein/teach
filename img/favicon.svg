<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mr. Ibrahim Hussein">
  <!-- The header brand mark: a gold tile carrying a navy </>. Drawn as strokes
       rather than text so it renders the same everywhere — favicon contexts do
       not reliably have the site's mono font available. -->
  <rect width="32" height="32" rx="7" fill="#c7a02e"/>
  <g fill="none" stroke="#16213f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="11.5,10.5 6.5,16 11.5,21.5"/>
    <line x1="18.6" y1="9.8" x2="13.4" y2="22.2"/>
    <polyline points="20.5,10.5 25.5,16 20.5,21.5"/>
  </g>
</svg>
